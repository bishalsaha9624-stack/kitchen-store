plugins {
    id 'com.android.application'
}

android {
    namespace 'com.schoolkitchen.store'
    compileSdk 34

    defaultConfig {
        applicationId "com.schoolkitchen.store"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
