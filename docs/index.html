<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f4a">
<title>School Kitchen Store</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec;--card:#fff;--ink:#17201b;--ink2:#3d4741;--muted:#6b736e;--line:#e6e2d8;--line2:#efece4;
  --pri:#1f6f4a;--pri-d:#185a3c;--pri2:#e4f1ea;--red:#c2410c;--red2:#fdeee5;--warn:#b45309;--warn2:#fdf3df;--crit:#b91c1c;--crit2:#fde8e8;
  --grid:#ebe7de;--shadow:0 1px 2px rgba(23,32,27,.04),0 6px 20px rgba(23,32,27,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101412;--card:#191f1c;--ink:#e8ece9;--ink2:#c3cac5;--muted:#929b95;--line:#29312d;--line2:#222925;
  --pri:#4cb07f;--pri-d:#3d9a6c;--pri2:#1b3127;--red:#f0905a;--red2:#3a2418;--warn:#e8a94a;--warn2:#3a2d16;--crit:#f27b7b;--crit2:#3b1e1e;--grid:#26302b;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.shell{display:flex;min-height:100vh}
.side{display:none}
.wrap{flex:1;min-width:0}
.page{max-width:980px;margin:0 auto;padding:0 16px 110px}
header{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0 10px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;overflow:hidden;border:0;padding:0}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.titlebtn{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.titlebtn h1{font-size:18px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.titlebtn small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.status{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--card)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px}
nav button.on{color:var(--pri)}
nav button svg{width:22px;height:22px}
@media (min-width:900px){
  nav.bottom{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:232px;padding:20px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--card)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .side .brand b{font-size:15px;line-height:1.2}
  .side button{flex:none;flex-direction:row;gap:12px;font-size:14.5px;padding:11px 12px;justify-content:flex-start}
  .side button.on{background:var(--pri2)}
  .page{padding:0 28px 60px}
  .fab{bottom:28px!important}
}
h2.h{font-size:22px;margin:14px 0 4px;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin:0 0 12px}
h3.sec{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3.sec span{color:var(--muted);font-weight:600;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:12px}
.pad{padding:18px}
.pad h2{margin:0 0 6px;font-size:18px}
.pad p{margin:0;color:var(--muted);line-height:1.5;font-size:14.5px}
.grid2{display:grid;gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
/* dashboard */
.hero{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border:0}
.hero .logo{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18)}
.hero h2{margin:0;font-size:19px}
.hero p{margin:3px 0 0;opacity:.85;font-size:13.5px;font-weight:600}
.hero .btn{margin-left:auto;background:#fff;color:var(--pri-d);white-space:nowrap}
@media (max-width:560px){.hero{flex-wrap:wrap}.hero .btn{margin-left:0;width:100%}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:14px 16px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.tile span{font-size:12.5px;color:var(--muted);font-weight:700;display:block}
.tile b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile small{font-size:12px;color:var(--muted);font-weight:600}
.tile.warn b{color:var(--warn)}
.chart{padding:16px 16px 10px;position:relative}
.chart h4{margin:0;font-size:15px}
.chart .cap{color:var(--muted);font-size:12.5px;font-weight:600;margin:2px 0 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted);font-size:11px;font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:5}
.lastrow{display:flex;align-items:center;gap:10px;padding:9px 0}
.lastrow .nm{width:42%;min-width:0;font-weight:700;font-size:14px;line-height:1.25}
.lastrow .nm .flag{display:inline-block;margin:2px 0 0 0}
.lastrow .nm{display:flex;flex-direction:column;align-items:flex-start}
.lastrow .bar{flex:1;height:12px;background:var(--line2);border-radius:6px;overflow:hidden}
.lastrow .bar i{display:block;height:100%;border-radius:0 6px 6px 0;background:var(--pri)}
.lastrow .bar i.w{background:var(--warn)} .lastrow .bar i.c{background:var(--crit)}
.lastrow .val{width:86px;text-align:right;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.flag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:4px}
.flag.c{background:var(--crit2);color:var(--crit)} .flag.w{background:var(--warn2);color:var(--warn)}
/* stock */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;outline:0}
.search:focus{border-color:var(--pri)}
.toolbar{display:flex;gap:8px;margin-top:12px}
.toolbar .search{flex:1}
.alert{display:block;width:100%;text-align:left;border:0;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--warn2);color:var(--warn);font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.qty b{font-size:18px;color:var(--ink)}
.low .qty b{color:var(--warn)} .zero .qty b{color:var(--red)}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:6px;background:var(--warn2);color:var(--warn)}
.zero .tag{background:var(--red2);color:var(--red)}
.pm{width:48px;height:48px;border-radius:14px;border:0;font-size:26px;font-weight:700;line-height:1;flex:none}
.minus{background:var(--red2);color:var(--red)} .plus{background:var(--pri2);color:var(--pri)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;padding:15px 22px;background:var(--pri);color:#fff;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{padding:30px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.grey{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.log{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.log:last-child{border-bottom:0}
.log small{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
.in{color:var(--pri);font-weight:800} .out{color:var(--red);font-weight:800}
.day{font-size:13px;font-weight:800;color:var(--muted);margin:18px 4px 6px}
.month{display:flex;align-items:center;gap:10px;margin-top:6px}
.month input{flex:1;max-width:260px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:800;background:var(--card)}
@media (max-width:560px){th,td{padding:9px 7px;font-size:13.5px}th{font-size:11px}}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
tbody tr:last-child td{border-bottom:0}
.rephead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 10px;flex-wrap:wrap}
.rephead h4{margin:0;font-size:16px}
.rephead p{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:600}
/* meals */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.add{border-style:dashed;color:var(--pri)}
.lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;outline:0;font-size:17px}
.field:focus{border-color:var(--pri)}
.big{font-size:28px;font-weight:800;text-align:center}
.row2{display:flex;gap:10px;margin-top:16px}
.row2 .btn{flex:1}
.mline{display:grid;grid-template-columns:1fr 104px;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.mline:last-child{border-bottom:0}
.mline .nm{font-weight:700}
.mline .meta{grid-column:1/2;font-size:12.5px;color:var(--muted);font-weight:600}
.mline input{grid-row:1/3;grid-column:2;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:right;font-size:16px}
.mline .warn{grid-column:1/3;font-size:13px;font-weight:700;color:var(--red)}
.mtotal{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted);font-weight:700}
.mealrow{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line2)}
.mealrow:last-child{border-bottom:0}
.mealrow .d{width:46px;text-align:center;flex:none;background:var(--pri2);color:var(--pri);border-radius:10px;padding:5px 0;font-weight:800;line-height:1.1}
.mealrow .d small{display:block;font-size:10.5px;font-weight:700}
.mealrow .b{flex:1;min-width:0}
.mealrow .b small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.4}
.linkbtn{border:0;background:none;font-weight:800;color:var(--pri);padding:4px;font-size:14px}
.linkbtn.r{color:var(--red)}
.ing{display:grid;grid-template-columns:1fr 92px 40px 32px;gap:6px;align-items:center;margin-top:8px}
.ing select,.ing input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-size:15px;color:inherit}
.ing input{text-align:right}
.ing span{font-size:13px;color:var(--muted);font-weight:700}
.ing button{border:0;background:none;color:var(--muted);font-size:20px}
/* popup */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet p{margin:0 0 12px;color:var(--muted)}
.units{display:flex;flex-wrap:wrap;gap:6px}
.units button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-weight:700}
.units button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.hide{display:none!important}
.note{font-size:13px;color:var(--muted);margin:10px 4px}
textarea{width:100%;min-height:150px;font-family:monospace;font-size:12px}
.logoedit{display:flex;align-items:center;gap:12px}
.logoedit .logo{width:64px;height:64px;border-radius:16px}
/* upload */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:16px;padding:26px 14px;border:2px dashed var(--line);border-radius:16px;text-align:center;cursor:pointer;color:var(--muted);font-weight:600}
.drop b{color:var(--pri);font-size:17px}
.err{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--red2);color:var(--red);font-weight:600}
.spin{width:38px;height:38px;border:4px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.urow{padding:12px 14px;border-bottom:1px solid var(--line2)}
.urow:last-child{border-bottom:0}
.urow.off{opacity:.45}
.uhead{display:flex;align-items:center;gap:10px}
.uhead input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.uhead .nm{flex:1;min-width:0;font-weight:700}
.urow select{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;color:inherit}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.nums label{font-size:12px;font-weight:700;color:var(--muted)}
.nums input{width:100%;margin-top:3px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;text-align:right;color:inherit}
.uwarn{margin-top:6px;font-size:13px;font-weight:700;color:var(--red)}
.uinfo{margin-top:6px;font-size:13px;color:var(--muted);font-weight:600}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:10px;margin-top:14px;z-index:5}
@media (min-width:900px){.sticky{bottom:12px}}
.sticky .btn{flex:1}
.delbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--red2);color:var(--red)}
.delbar .linkbtn{color:inherit;text-decoration:underline}
.delrow{cursor:pointer}
.delrow input{width:24px;height:24px;accent-color:var(--red);flex:none}
.delrow.sel{background:var(--red2)}
body.gated nav,body.gated #addbtn,body.gated #setBtn,body.gated .side{display:none!important}
.gate{max-width:440px;margin:40px auto 0;text-align:center}
.gate .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px}
.gate h2{font-size:22px;margin:0 0 8px}
.gate p{margin:0 0 6px}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;color:#1f1f1f;border-radius:99px;padding:12px 22px;font-weight:700;margin-top:18px;font-size:16px}
.gbtn svg{width:20px;height:20px}
.email{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:10px;background:var(--pri2);color:var(--pri);font-weight:800;word-break:break-all}
.staff{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2);font-weight:600;font-size:15px;word-break:break-all}
.staff span{flex:1}
.staff small{color:var(--muted);font-weight:700}
.addstaff{display:flex;gap:8px;margin-top:10px}
.addstaff input{flex:1;min-width:0;font-size:15px}
.sect{border-top:1px solid var(--line);margin-top:20px;padding-top:4px}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side"></nav>
  <div class="wrap"><div class="page">
    <header><div class="top">
      <button class="logo" id="logoBtn" aria-label="School settings"></button>
      <button class="titlebtn" id="titleBtn"><h1 id="title">Kitchen Store</h1><small id="subtitle">School kitchen inventory</small></button>
      <span class="status" id="status"></span>
      <button class="iconbtn" id="setBtn" aria-label="Settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div></header>
    <div id="main"></div>
  </div></div>
</div>
<nav class="bottom" id="bottom"></nav>
<button class="fab hide" id="addbtn">+ Add item</button>
<div id="pop"></div>
<div id="toast" class="toast hide"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const r3 = n => Math.round(n * 1000) / 1000;
const fmt = n => String(r3(+n || 0));
const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => iso(new Date());
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); };

async function safe(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'permission-denied')) { S.canWrite = false; toast('You can only view this store. Ask the owner for edit access.'); render(true); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full.');
    else toast('Not saved. Check internet and try again.');
    throw e;
  }
}
const newId = (col = 'items') => db ? db.collection(col).doc().id : col[0] + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function put(col, obj) {
  const {id, ...d} = obj;
  if (db) return safe(() => fsw(db.collection(col).doc(id).set(d)));
  const arr = S[col], i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = obj; else arr.unshift(obj);
  if (col === 'logs' && arr.length > 4000) arr.length = 4000;
  LS.set(col, arr);
}
async function remove(col, id) {
  if (db) return safe(() => fsw(db.collection(col).doc(id).delete()));
  S[col] = S[col].filter(x => x.id !== id); LS.set(col, S[col]);
}
const saveItem = it => put('items', it);
const delItem = id => remove('items', id);
const addLog = l => put('logs', {id: newId('logs'), ...l});
async function saveSettings(s) {
  if (db) return safe(() => fsw(db.doc('settings/main').set(s)));

}

const menuById = id => S.menus.find(x => x.id === id);
const isLow = it => (+it.qty || 0) <= 0 || ((+it.minQty || 0) > 0 && (+it.qty || 0) <= +it.minQty);

async function change(id, type, amount, note, date, extra) {
  const it = byId(id); const cur = +it.qty || 0;
  if (type === 'out' && amount > cur + 1e-9) throw new Error(`Only ${fmt(cur)} ${it.unit} of ${it.name} left`);
  const delta = type === 'out' ? -amount : amount, qty = r3(cur + delta), at = Date.now();
  await saveItem({...it, qty, updatedAt: at});
  await addLog({itemId: id, itemName: it.name, unit: it.unit, type, delta: r3(delta), balance: qty, date: date || today(), note: note || '', at, by: S.me || '', ...(extra || {})});
  return qty;
}

function usageStats() {
  // average use per cooking day over the last 30 days, from the log
  const from = addDays(today(), -30), days = new Set(), used = {};
  S.logs.forEach(l => {
    if (l.date < from || l.date > today()) return;
    if (l.type === 'out') { days.add(l.date); used[l.itemId] = (used[l.itemId] || 0) - (+l.delta || 0); }
    else if (l.type === 'undo') used[l.itemId] = (used[l.itemId] || 0) - (+l.delta || 0);
  });
  S.meals.forEach(m => { if (m.date >= from) days.add(m.date); });
  const n = Math.max(days.size, 1);
  return S.items.map(it => {
    const perDay = (used[it.id] || 0) / n;
    return {it, perDay, days: perDay > 0 ? (+it.qty || 0) / perDay : null};
  }).filter(x => x.days !== null).sort((a, b) => a.days - b.days);
}

function columnChart(series) {
  const W = 340, H = 170, L = 30, B = 22, T = 8, max = Math.max(10, ...series.map(s => s.v));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= max) return k * p; return 10 * p; })();
  const cw = (W - L) / series.length, bw = Math.max(6, cw - 6);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + (H - B - T) * (1 - i / 4); g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(nice * i / 4)}</text>`; }
  series.forEach((s, i) => {
    const x = L + i * cw + (cw - bw) / 2, h = s.v / nice * (H - B - T), y = H - B - h;
    if (s.v > 0) g += `<path d="M${x},${H - B} V${y + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${H - B} z" fill="var(--pri)"/>`;
    g += `<rect x="${L + i * cw}" y="${T}" width="${cw}" height="${H - B - T}" fill="transparent" data-tip="${esc(niceDay(s.d))}: ${s.v ? s.v + ' students' : 'no meal entered'}"/>`;
    if (i % 2 === (series.length - 1) % 2) g += `<text x="${L + i * cw + cw / 2}" y="${H - 6}" text-anchor="middle">${new Date(s.d + 'T00:00:00').getDate()}</text>`;
  });
  g += `<line x1="${L}" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="var(--line)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Students served per day, last 14 days">${g}</svg>`;
}
function wireTips(box) {
  if (!box) return;
  let tip = null;
  const show = e => {
    const r = e.target.closest('[data-tip]'); if (!r) { hide(); return; }
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip); }
    tip.textContent = r.dataset.tip;
    const bb = box.getBoundingClientRect(), rb = r.getBoundingClientRect();
    tip.style.left = Math.min(bb.width - 70, Math.max(70, rb.left - bb.left + rb.width / 2)) + 'px';
    tip.style.top = (rb.top - bb.top + 40) + 'px';
  };
  const hide = () => { if (tip) { tip.remove(); tip = null; } };
  box.addEventListener('mousemove', show); box.addEventListener('click', show); box.addEventListener('mouseleave', hide);
}

function logRow(l) {
  const plus = (l.delta || 0) >= 0;
  const word = l.type === 'out' ? 'Used' : l.type === 'count' ? 'Corrected' : l.type === 'open' ? 'Opening stock' : l.type === 'undo' ? 'Meal cancelled' : 'Received';
  return `<div class="log"><div style="min-width:0"><b>${esc(l.itemName)}</b><small>${word}${l.note ? ' · ' + esc(l.note) : ''} · ${l.date !== today() ? esc(niceDay(l.date)) + ', ' : ''}${time(l.at)}${l.by ? ' · <span class="who" data-uid="' + esc(l.by) + '"></span>' : ''}</small></div>
    <div style="text-align:right;white-space:nowrap"><span class="${plus ? 'in' : 'out'}">${plus ? '+' : '−'}${fmt(Math.abs(l.delta))} ${esc(l.unit)}</span><small>left ${fmt(l.balance)}</small></div></div>`;
}
function renderHistory() {
  if (!S.logs.length) { $('#main').innerHTML = '<h2 class="h">History</h2><div class="card empty"><b>Nothing yet</b>Every entry you make will show here.</div>'; return; }
  let h = '<h2 class="h">History</h2>', day = '';
  [...S.logs].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.at - a.at).slice(0, 300).forEach(l => {
    if (l.date !== day) { if (day) h += '</div>'; day = l.date; h += `<div class="day">${esc(niceDay(day))}</div><div class="card">`; }
    h += logRow(l);
  });
  $('#main').innerHTML = h + '</div>';
}

const perUnit = u => /^(kg|kgs|kilo)/i.test(u || '') ? {lab: 'g', f: 1000} : /^(l|lt|ltr|litre|liter|litres)$/i.test(u || '') ? {lab: 'ml', f: 1000} : {lab: u || 'pcs', f: 1};
function mealLines() {
  const menu = menuById(M.menuId); if (!menu) return [];
  const n = num(M.students);
  return (menu.items || []).map(ing => {
    const it = byId(ing.itemId); if (!it) return null;
    const calc = n > 0 ? r3((+ing.per || 0) * n) : 0;
    const over = M.over[it.id];
    const qty = over !== undefined && over !== '' ? num(over) : calc;
    return {it, per: +ing.per || 0, calc, qty: isNaN(qty) ? 0 : r3(qty), on: !M.off[it.id]};
  }).filter(Boolean);
}

async function logsBetween(from, to) {
  if (db) {
    const snap = await db.collection('logs').where('date', '>=', from).limit(1000).get();
    return {rows: snap.docs.map(d => d.data()), capped: snap.size >= 1000};
  }
  return {rows: S.logs.filter(l => l.date >= from), capped: false};
}
async function mealsBetween(from, to) {
  if (db) { const snap = await db.collection('meals').where('date', '>=', from).where('date', '<=', to).limit(1000).get(); return snap.docs.map(d => d.data()); }
  return S.meals.filter(m => m.date >= from && m.date <= to);
}
async function loadReport() {
  const m = S.month, from = m + '-01', to = lastDay(m);
  S.report = null; if (S.tab === 'reports') renderReports();
  try {
    const [{rows, capped}, meals] = await Promise.all([logsBetween(from, to), mealsBetween(from, to)]);
    const R = {};
    S.items.forEach(it => R[it.id] = {id: it.id, name: it.name, unit: it.unit, rec: 0, used: 0, after: 0, now: +it.qty || 0});
    const daily = {}, usedIds = new Set();
    rows.forEach(l => {
      const r = R[l.itemId]; if (!r) return;
      if (l.date > to) { r.after += +l.delta || 0; return; }
      if (l.type === 'in') r.rec += +l.delta || 0;
      else if (l.type === 'out' || l.type === 'undo') {
        r.used -= +l.delta || 0;
        daily[l.date] = daily[l.date] || {};
        daily[l.date][l.itemId] = r3((daily[l.date][l.itemId] || 0) - (+l.delta || 0));
        usedIds.add(l.itemId);
      }
    });
    const stock = Object.values(R).map(r => { const end = r3(r.now - r.after); return {...r, rec: r3(r.rec), used: r3(r.used), end, open: r3(end - r.rec + r.used)}; }).sort((a, b) => a.name.localeCompare(b.name));
    const studentsBy = {}, menusBy = {};
    meals.forEach(x => { studentsBy[x.date] = (studentsBy[x.date] || 0) + (+x.students || 0); (menusBy[x.date] = menusBy[x.date] || []).push(x.menuName); });
    const dates = [...new Set([...Object.keys(daily), ...Object.keys(studentsBy)])].filter(d => d >= from && d <= to).sort();
    const cols = stock.filter(r => usedIds.has(r.id));
    S.report = {month: m, stock, capped, daily: {dates, cols, cells: daily, students: studentsBy, menus: menusBy}};
  } catch { S.report = {error: true}; }
  if (S.tab === 'reports') renderReports();
}

const PDFLIB = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
async function offerFile(filename, data) {
  if (dl) {
    try { await dl.save({filename, data}); toast('Downloaded ' + filename); return; }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') return toast('Please wait a moment and try again.');
    }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded ' + filename);
  } catch { toast('Downloading is not available here.'); }
}
function regTables(kind) {
  const R = S.report, D = R.daily;
  if (kind === 'stock') return {
    title: 'Monthly Stock Register', head: ['S.No', 'Item', 'Unit', 'Opening', 'Received', 'Total', 'Used', 'Closing'],
    body: R.stock.map((r, i) => [i + 1, r.name, r.unit, fmt(r.open), fmt(r.rec), fmt(r.open + r.rec), fmt(r.used), fmt(r.end)]), foot: null
  };
  const tot = D.cols.map(c => fmt(D.dates.reduce((a, d) => a + ((D.cells[d] || {})[c.id] || 0), 0)));
  return {
    title: 'Daily Consumption Register', head: ['Date', 'Menu', 'Students', ...D.cols.map(c => `${c.name} (${c.unit})`)],
    body: D.dates.map(d => [shortDate(d), (D.menus[d] || []).join(' + '), D.students[d] || 0, ...D.cols.map(c => D.cells[d] && D.cells[d][c.id] ? fmt(D.cells[d][c.id]) : '')]),
    foot: ['Total', '', D.dates.reduce((a, d) => a + (D.students[d] || 0), 0), ...tot]
  };
}

async function handleFiles(files) {
  const f = files[0], ext = (f.name.split('.').pop() || '').toLowerCase();
  const isX = ['xlsx', 'xls', 'csv', 'ods'].includes(ext);
  const isPdf = ext === 'pdf' || f.type === 'application/pdf';
  const imgs = files.filter(x => x.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(x.name));
  U.msg = ''; U.file = files.length > 1 && imgs.length === files.length ? `${files.length} photos` : f.name;
  U.stage = 'reading'; U.note = ''; renderUpload();
  try {
    let data;
    if (isX) {
      const sheets = await readExcel(f);
      if (sample) {
        try { data = await askClaude(sheetsText(sheets), []); }
        catch (e) { if (e && e.code === 'cancelled') throw e; data = localParse(sheets); }
      } else data = localParse(sheets);
    } else if (isPdf) {
      if (!sample || !imgMax) throw {mine: 'Reading PDFs is not available here. Please use an Excel file, or open the app from its shared link.'};
      U.note = 'Opening the PDF…'; renderUpload();
      const {blobs, text, total} = await pdfToImages(f, Math.min(imgMax, 5));
      U.note = total > blobs.length ? `Reading the first ${blobs.length} of ${total} pages. This can take up to a minute.` : 'This can take up to a minute.'; renderUpload();
      data = await askClaude(text.trim() ? 'Text found in the PDF (may be incomplete):\n' + text.slice(0, 40000) : '', blobs);
    } else if (imgs.length) {
      if (!sample || !imgMax) throw {mine: 'Reading photos is not available here. Please use an Excel file, or open the app from its shared link.'};
      const blobs = []; for (const x of imgs.slice(0, imgMax)) blobs.push(await toJpeg(x));
      data = await askClaude('', blobs);
    } else throw {mine: 'This file type is not supported. Use a photo, PDF, Excel or CSV file.'};
    setRows(data);
  } catch (e) {
    U.stage = 'pick';
    U.msg = e && e.mine ? e.mine : e && e.code === 'cancelled' ? '' : errText(e);
    renderUpload();
  }
}
function errText(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Permission to read the file was not given. Excel files can still be read.';
  if (c === 'rate_limited') return 'Too many files read just now. Please wait a few minutes and try again.';
  if (c === 'image_rejected') return 'This photo could not be opened. Try taking the photo again.';
  if (c === 'invalid_json' || c === 'empty_completion' || c === 'refused') return 'Could not read the file clearly. Try a clearer, well-lit photo of the page.';
  if (e && e.message === 'load') return 'Could not load the file reader. Check your internet connection.';
  return 'Could not read this file. Please try again.';
}

async function readExcel(f) {
  await loadScript(CDN.xlsx);
  const wb = XLSX.read(await f.arrayBuffer(), {type: 'array', cellDates: true});
  return wb.SheetNames.map(n => ({name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: false, defval: ''}).filter(r => r.some(c => String(c).trim()))}));
}
const sheetsText = sheets => sheets.map(s => `Sheet "${s.name}":\n` + s.rows.slice(0, 400).map(r => r.map(c => String(c).trim()).join(' | ')).join('\n')).join('\n\n').slice(0, 60000);

function localParse(sheets) {
  const rx = {
    name: /item|name|particular|commodit|descri|material|product|article|ingredient|सामग्री|वस्तु|नाम/i,
    unit: /^\s*(unit|uom|units)\s*$/i,
    opening: /open|previous|prev|b\s*\/\s*f|brought|old stock|प्रारंभिक|शेष पिछला/i,
    received: /receiv|rec'?d|rcvd|purchas|suppl|inward|\bin\b|प्राप्त/i,
    used: /consum|used|issue|utili|expend|\bout\b|खपत|उपयोग/i,
    qty: /qty|quantity|stock|balance|मात्रा/i
  };
  const out = [];
  for (const s of sheets) {
    const hi = s.rows.slice(0, 15).findIndex(r => r.some(c => rx.name.test(c)));
    if (hi < 0) continue;
    const h = s.rows[hi].map(c => String(c));
    const col = k => h.findIndex(c => c.trim() && rx[k].test(c) && !/rate|price|amount|cost|value|₹|rs\.?/i.test(c));
    const ci = {name: h.findIndex(c => rx.name.test(c)), unit: col('unit'), opening: col('opening'), received: col('received'), used: col('used'), qty: col('qty')};
    if (ci.qty >= 0 && [ci.opening, ci.received, ci.used].includes(ci.qty)) ci.qty = -1;
    if (ci.opening < 0 && ci.received < 0 && ci.used < 0 && ci.qty < 0) continue;
    const plain = U.hint === 'auto' ? 'received' : U.hint;
    for (const r of s.rows.slice(hi + 1)) {
      const name = String(r[ci.name] || '').trim();
      if (!name || /^total|grand total|कुल/i.test(name) || /^\d+$/.test(name)) continue;
      const row = {name, unit: ci.unit >= 0 ? String(r[ci.unit] || '').trim() || null : null, opening: null, received: null, used: null, match: null};
      for (const k of ['opening', 'received', 'used']) if (ci[k] >= 0) row[k] = numOrNull(r[ci[k]]);
      if (ci.qty >= 0 && row[plain] == null) row[plain] = numOrNull(r[ci.qty]);
      if (row.opening != null || row.received != null || row.used != null) out.push(row);
    }
  }
  if (!out.length) throw {mine: 'Could not find item names and quantities in this file. Make sure it has a column for the item name and a column for the quantity.'};
  return {date: null, rows: out};
}

async function pdfToImages(f, max) {
  await loadScript(CDN.pdfw); await loadScript(CDN.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfw;
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
  const n = Math.min(pdf.numPages, max), blobs = []; let text = '';
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    try { const tc = await page.getTextContent(); text += tc.items.map(x => x.str).join(' ') + '\n'; } catch {}
    const v1 = page.getViewport({scale: 1}), sc = Math.min(2.5, 1800 / Math.max(v1.width, v1.height)), vp = page.getViewport({scale: sc});
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    blobs.push(await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.88)));
  }
  return {blobs, text, total: pdf.numPages};
}
async function toJpeg(f) {
  try {
    const bmp = await createImageBitmap(f);
    const sc = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || f), 'image/jpeg', 0.9));
  } catch { return f; }
}

function setRows(data) {
  const rows = (data && Array.isArray(data.rows)) ? data.rows : [];
  U.rows = rows.map(r => {
    const name = String(r.name || '').trim(); if (!name) return null;
    let it = r.match ? S.items.find(i => norm(i.name) === norm(r.match)) : null;
    if (!it) it = findMatch(name);
    return {on: true, name, unit: r.unit ? String(r.unit).trim() : '', opening: numOrNull(r.opening), received: numOrNull(r.received), used: numOrNull(r.used), matchId: it ? it.id : 'new'};
  }).filter(r => r && (r.opening != null || r.received != null || r.used != null));
  const d = data && typeof data.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(data.date) && data.date <= today() ? data.date : today();
  U.date = d;
  if (!U.rows.length) { U.stage = 'pick'; U.msg = 'No items with quantities were found in this file.'; return renderUpload(); }
  U.stage = 'review'; renderUpload(); window.scrollTo(0, 0);
}

function checkRows() {
  const run = {};
  return U.rows.map(r => {
    if (!r.on) return '';
    const it = r.matchId === 'new' ? null : byId(r.matchId);
    const key = r.matchId === 'new' ? 'new:' + norm(r.name) : r.matchId;
    let q = key in run ? run[key] : (it ? +it.qty || 0 : 0);
    if (r.opening != null) q = r.opening;
    q += (r.received || 0) - (r.used || 0);
    run[key] = q;
    if (q < -1e-9) return `Used is more than the stock available. Check the numbers.`;
    if (r.opening == null && r.received == null && r.used == null) return 'Enter at least one number.';
    return '';
  });
}
function rowInfo(r) {
  const it = r.matchId === 'new' ? null : byId(r.matchId);
  const unit = it ? it.unit : (r.unit || 'kg');
  let q = it ? +it.qty || 0 : 0;
  if (r.opening != null) q = r.opening;
  q = r3(q + (r.received || 0) - (r.used || 0));
  return it ? `Now ${fmt(it.qty)} ${unit} → after saving ${fmt(q)} ${unit}` : `New item · will have ${fmt(q)} ${unit}`;
}

async function applyUpload() {
  const b = $('#usave'); b.disabled = true; b.textContent = 'Saving…';
  const run = {}, created = {};
  let done = 0;
  try {
    for (const r of U.rows) {
      if (!r.on) continue;
      let it;
      if (r.matchId === 'new') {
        const key = norm(r.name);
        if (created[key]) it = created[key];
        else {
          const at = Date.now(), unit = r.unit || 'kg';
          const exists = S.items.find(i => norm(i.name) === key);
          it = exists || {id: newId(), name: r.name, unit, qty: 0, minQty: 0, category: '', expiry: '', location: '', createdAt: at, updatedAt: at};
          if (!exists) await saveItem(it);
          created[key] = it;
        }
      } else it = byId(r.matchId);
      if (!it) continue;
      let qty = it.id in run ? run[it.id] : (+it.qty || 0);
      const logs = [];
      if (r.opening != null) { const d = r3(r.opening - qty); qty = r3(r.opening); logs.push({type: 'open', delta: d, balance: qty, note: 'Opening stock'}); }
      if (r.received) { qty = r3(qty + r.received); logs.push({type: 'in', delta: r3(r.received), balance: qty, note: 'Received'}); }
      if (r.used) { qty = r3(qty - r.used); logs.push({type: 'out', delta: r3(-r.used), balance: qty, note: 'Used'}); }
      if (!logs.length) continue;
      await saveItem({...it, qty, updatedAt: Date.now()});
      run[it.id] = qty; created[norm(it.name)] && (created[norm(it.name)] = {...it, qty});
      for (const l of logs) await addLog({itemId: it.id, itemName: it.name, unit: it.unit, ...l, note: l.note + ' · from ' + U.file, date: U.date, at: Date.now(), by: S.me || ''});
      done++;
    }
    toast(`Saved ${done} ${done === 1 ? 'item' : 'items'} from the file`);
    U.stage = 'pick'; U.rows = []; U.msg = '';
    S.tab = 'stock'; $('#main').innerHTML = ''; render(true);
  } catch {
    b.disabled = false; b.textContent = 'Try saving again';
    toast(done ? `Saved ${done} items, then stopped. Check the stock list before trying again.` : 'Not saved. Check internet and try again.');
  }
}

function fsw(p) {
  return new Promise((res, rej) => {
    let settled = false;
    const t = setTimeout(() => { settled = true; res(); }, 1500);
    p.then(() => { if (!settled) { clearTimeout(t); settled = true; res(); } },
      e => { if (!settled) { clearTimeout(t); settled = true; rej(e); } else toast(e && e.code === 'permission-denied' ? 'A change was refused. Check the Firebase rules.' : 'A change could not be saved. Check internet.'); });
  });
}

        b.textContent = `Importing ${Math.min(i + 400, ops.length)} of ${ops.length}…`;
        const batch = db.batch();
        ops.slice(i, i + 400).forEach(([c, id, x]) => batch.set(db.collection(c).doc(id), x));
        await batch.commit();
      }
      close(); toast(`Imported ${d.items.length} items`); go('stock');
    } catch (e) { b.disabled = false; b.textContent = 'Try again'; toast('Import failed. Check internet and try again.'); }
  };
}
document.addEventListener('change', e => { if (e.target.id === 'impFile' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; importBackup(f); } });
window.addEventListener('online', () => render()); window.addEventListener('offline', () => render());

/* ---------- start ---------- */
(function boot() {
  S.mode = 'loading';
  render(true);
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) {
    return gate(`<h2>Almost ready</h2><p>${window.firebase ? 'The Firebase settings have not been added yet.' : 'Could not load. Check your internet connection and reload.'}</p>`);
  }
  firebase.initializeApp(cfg);
  db = firebase.firestore();
  try { db.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch {}
  startApp();
})();
</script>
</body>
