name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml', '*.gradle']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KitchenStore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenStore-apk
          path: KitchenStore.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KitchenStore.apk \
            --title "Kitchen Store app (latest)" \
            --notes "Download KitchenStore.apk below and open it on your Android phone to install."
